[project]
name = "astrbot-plugin-qqofficial-admin"
version = "1.1.0"
description = "QQ 官方机器人群管理：原生按钮、成员管理、禁言、入群审批与策略"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.11.18,<4"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
